name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  static:
    name: Typecheck, lint, schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm --filter @intelicont/web exec tsc --noEmit
      - name: Lint (errors fail the build)
        run: pnpm --filter @intelicont/web lint
      - name: Migrations match the schema
        run: |
          pnpm exec drizzle-kit generate
          git status --short packages/ledger/db/migrations
          git diff --exit-code packages/ledger/db/migrations
          test -z "$(git ls-files --others --exclude-standard packages/ledger/db/migrations)"

  tests:
    name: Unit + DB tests with coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only throwaway server; createTestDb creates and drops its own databases and roles.
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DB_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit + real-Postgres tests together: the use cases are only exercised by the DB suite.
      - name: Vitest with coverage (thresholds in apps/web/vitest.config.ts)
        run: pnpm --filter @intelicont/web test:cov
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-lcov
          path: apps/web/coverage/lcov.info
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [static]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DB_SLOW: "1"
      # Dummy, test-only values; e2e/global-setup.ts also generates its own per-run auth secret.
      BETTER_AUTH_SECRET: ci-only-dummy-secret-not-used-in-production
      AI_PROVIDER: rules
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @intelicont/web exec playwright install chromium --with-deps
      - name: Run Playwright (starts its own web server and throwaway DB)
        run: pnpm --filter @intelicont/web test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Next.js
        run: pnpm --filter @intelicont/web build
